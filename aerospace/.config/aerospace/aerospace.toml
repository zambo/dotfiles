# Config version for compatibility and deprecations
# See: https://nikitabobko.github.io/AeroSpace/guide#config-version
config-version = 2

start-at-login = true                               # 'start-at-login' needs to be 'true' for 'after-login-command' to work
after-login-command = []
after-startup-command = ['exec-and-forget borders']
# on-focus-changed = ['move-mouse window-lazy-center']

# Reload the config automatically when the file is saved.
# See: https://nikitabobko.github.io/AeroSpace/guide#config-version
auto-reload-config = true

# config-version = 2 makes 'persistent-workspaces' explicit instead of inferred
# from keybindings. List every workspace that should stay alive even when empty.
# See: https://nikitabobko.github.io/AeroSpace/guide#config-version-2
persistent-workspaces = ["🯱", "🯲", "🯳", "🯴", "🯵", "🯶", "🯷", "🯸", "🯹"]

enable-normalization-flatten-containers = true                         # Normalizations. See:https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 16
default-root-container-layout = 'tiles'
default-root-container-orientation = 'vertical'                 # Possible values: horizontal|vertical|auto
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = true

# @deprecated @see https://nikitabobko.github.io/AeroSpace/guide#deprecations
# See: https://nikitabobko.github.io/AeroSpace/guide#on-window-detected-callback
# NOTE: `if = 'test ...'` is the current recommended syntax, replacing the
# legacy `if.app-id` / `if.window-title-regex-substring` dot-key syntax
# (soft-deprecated but still supported).
# NOTE: single-line inline tables (not TOML 1.1 multi-line) on purpose —
# taplo (LSP) doesn't parse TOML 1.1's multi-line inline tables yet.
on-window-detected = [
  # Matches PiP windows regardless of browser (Chrome, Zen, etc.)
  { if = 'test %{window-title} ~= Picture-in-Picture', run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.apple.calendar', run = [
    'workspace 1',
    'move-workspace-to-monitor main',
  ] },
  # { if = 'test %{app-bundle-id} = com.apple.iphonesimulator', run = '...' },
]

# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 2
outer.bottom = 2
outer.top = [{ monitor."LG HDR 4K" = 2 }, { monitor."Sidecar Display" = 2 }, 2]
outer.right = 2

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 22, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
#                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
#                   backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift
# All possible commands: https://nikitabobko.github.io/AeroSpace/commands
# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# You can uncomment the following lines to open up terminal with alt + enter shortcut
# (like in i3)
# alt-enter = '''exec-and-forget osascript -e '
# tell application "Terminal"
#     do script
#     activate
# end tell'

[mode.main.binding]
alt-enter = 'fullscreen --no-outer-gaps'
alt-ctrl-semicolon = 'mode leader'
# alt-ctrl-semicolon = 'mode service'
# alt-ctrl-esc = ['reload-config']
cmd-shift-esc = ['reload-config']
cmd-h = []                                             # Disable "hide application"
cmd-alt-h = []                                         # Disable "hide others"
cmd-shift-7 = 'exec-and-forget screencapture -i -c -w' # Screenshot to clipboardth - window only
cmd-shift-8 = 'exec-and-forget screencapture -i -c'    # Screenshot to clipboardth - interactive


[mode.leader.binding]
g = 'mode workspace-nav'  # "go" to workspace / navigate workspaces
s = 'mode workspace-move' # "send" window to workspace  
f = 'mode window-nav'     # "focus" / find windows
m = 'mode window-move'    # "move" windows
j = 'mode window-merge'   # "join" windows together
a = 'mode app-launcher'   # "app" launcher
r = 'mode resize-window'  # "resize" window
# = 'move-workspace-to-monitor --wrap-around next'
esc = 'mode main' # "quit" back to main (safety exit)

[mode.workspace-nav.binding]
x = ['workspace 🯱', 'mode main']
c = ['workspace 🯲', 'mode main']
d = ['workspace 🯳', 'mode main']
r = ['workspace 🯴', 'mode main']
s = ['workspace 🯵', 'mode main']
t = ['workspace 🯶', 'mode main']
w = ['workspace 🯷', 'mode main']
f = ['workspace 🯸', 'mode main']
p = ['workspace 🯹', 'mode main']
1 = ['workspace 🯱', 'mode main']
2 = ['workspace 🯲', 'mode main']
3 = ['workspace 🯳', 'mode main']
4 = ['workspace 🯴', 'mode main']
5 = ['workspace 🯵', 'mode main']
6 = ['workspace 🯶', 'mode main']
7 = ['workspace 🯷', 'mode main']
8 = ['workspace 🯸', 'mode main']
9 = ['workspace 🯹', 'mode main']

# g = ['workspace G', 'mode main']
# v = ['workspace V', 'mode main']
# a = ['workspace A', 'mode main']
# z = ['workspace Z', 'mode main']

# Skip empty workspaces when cycling. Uses AeroSpace's native shell pipe
# operator (0.21+) instead of shelling out to a second 'aerospace' process.
# See: https://nikitabobko.github.io/AeroSpace/guide#shell
q = [
  'list-workspaces --monitor focused --empty no | workspace --stdin --wrap-around next',
  'mode main',
]
b = [
  'list-workspaces --monitor focused --empty no | workspace --stdin --wrap-around prev',
  'mode main',
]
tab = ['workspace-back-and-forth', 'mode main']
esc = 'mode main' # "quit" back to main (safety exit)

[mode.workspace-move.binding]
x = ['move-node-to-workspace 🯱', 'mode main']
c = ['move-node-to-workspace 🯲', 'mode main']
d = ['move-node-to-workspace 🯳', 'mode main']
r = ['move-node-to-workspace 🯴', 'mode main']
s = ['move-node-to-workspace 🯵', 'mode main']
t = ['move-node-to-workspace 🯶', 'mode main']
w = ['move-node-to-workspace 🯷', 'mode main']
f = ['move-node-to-workspace 🯸', 'mode main']
p = ['move-node-to-workspace 🯹', 'mode main']
1 = ['move-node-to-workspace 🯱', 'mode main']
2 = ['move-node-to-workspace 🯲', 'mode main']
3 = ['move-node-to-workspace 🯳', 'mode main']
4 = ['move-node-to-workspace 🯴', 'mode main']
5 = ['move-node-to-workspace 🯵', 'mode main']
6 = ['move-node-to-workspace 🯶', 'mode main']
7 = ['move-node-to-workspace 🯷', 'mode main']
8 = ['move-node-to-workspace 🯸', 'mode main']
9 = ['move-node-to-workspace 🯹', 'mode main']

# b = ['move-node-to-workspace B', 'mode main']
# g = ['move-node-to-workspace G', 'mode main']
# v = ['move-node-to-workspace V', 'mode main']
# q = ['move-node-to-workspace Q', 'mode main']
# a = ['move-node-to-workspace A', 'mode main']
# z = ['move-node-to-workspace Z', 'mode main']

esc = 'mode main' # "quit" back to main (safety exit)

[mode.window-nav.binding]
n = ['focus left', 'mode main']
e = ['focus down', 'mode main']
i = ['focus up', 'mode main']
o = ['focus right', 'mode main']
t = ['layout tiles horizontal vertical', 'mode main']
a = ['layout accordion horizontal vertical', 'mode main']
tab = [
  'focus dfs-next --boundaries-action wrap-around-the-workspace',
  'mode main',
]
shift-tab = [
  'focus dfs-prev --boundaries-action wrap-around-the-workspace',
  'mode main',
]
esc = 'mode main' # "quit" back to main (safety exit)

[mode.window-move.binding]
n = ['move left', 'mode main']
e = ['move down', 'mode main']
i = ['move up', 'mode main']
o = ['move right', 'mode main']

[mode.resize-window.binding]
n = ['resize width -150']
e = ['resize height -150']
i = ['resize height +150']
o = ['resize width +150']
r = ['balance-sizes']
f = ['flatten-workspace-tree']
minus = ['resize smart -150']
equal = ['resize smart +150']
esc = 'mode main'              # "quit" back to main (safety exit)

[mode.window-merge.binding]
n = ['join-with left', 'mode main']
e = ['join-with down', 'mode main']
i = ['join-with up', 'mode main']
o = ['join-with right', 'mode main']
esc = 'mode main'                    # "quit" back to main (safety exit)

[mode.app-launcher.binding]
a = ['exec-and-forget open -a "Arc"', 'mode main']
c = ['exec-and-forget open -a "Calendar"', 'mode main']
m = ['exec-and-forget open -a "Mail"', 'mode main']
b = ['exec-and-forget open -a "Google Chrome"', 'mode main']
s = ['exec-and-forget open -a "Slack"', 'mode main']
f = ['exec-and-forget open -a "Finder"', 'mode main']
p = ['exec-and-forget open -a "1Password"', 'mode main']
t = ['exec-and-forget open -a "Ghostty"', 'mode main']
d = ['exec-and-forget open -a "Docker Desktop"', 'mode main']
v = ['exec-and-forget open -a "Spotify"', 'mode main']
esc = 'mode main'

[workspace-to-monitor-force-assignment]
